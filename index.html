<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Seeora · v8</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<style>
:root{
  --brand:#2d7a6b;--brandRgb:45,122,107;--brand-deep:#245f54;
  --brand-soft:#e8f2ef;--brand-soft-text:#245f54;
  --rest:#94a8a2;--missFill:rgba(0,0,0,0.04);--missStroke:rgba(0,0,0,0.12);
  --bg:#f1ede6;--bg-outer:#e3ded4;--card:#ffffff;--input-bg:#ffffff;
  --ink:#2a2a2a;--muted:#8a8a85;--tagline:#b9b3a8;--hair:rgba(0,0,0,0.06);
  --tabbar-bg:rgba(255,255,255,.94);
  --mig-card-bg:#eef4f2;--mig-card-border:rgba(45,122,107,.20);--mig-card-hair:rgba(45,122,107,.14);--mig-t:#245f54;
  --add-row-border:rgba(0,0,0,0.10);--add-row-bg:rgba(255,255,255,.55);
  --ringGuide:rgba(0,0,0,0.06);--ringTodayStroke:#f1ede6;
  --gridLine:rgba(0,0,0,0.06);--axisLine:rgba(0,0,0,0.12);--axisText:#8a8a85;--heatEmpty:rgba(0,0,0,0.05);
  --icon-btn-shadow:0 1px 2px rgba(0,0,0,.03);
  --card-shadow:0 1px 2px rgba(0,0,0,.03),0 4px 12px rgba(0,0,0,.05);
  --card-shadow-press:0 1px 2px rgba(0,0,0,.04);
}
[data-theme="dark"]{
  --brand:#4a9c8a;--brandRgb:74,156,138;--brand-deep:#2d7a6b;
  --brand-soft:rgba(74,156,138,0.14);--brand-soft-text:#7fc0b0;
  --rest:#6b7d78;--missFill:rgba(255,255,255,0.05);--missStroke:rgba(255,255,255,0.15);
  --bg:#1c1b19;--bg-outer:#0f0e0d;--card:#292725;--input-bg:#322f2c;
  --ink:#ebe8e2;--muted:#8a8a85;--tagline:#6b6862;--hair:rgba(255,255,255,0.08);
  --tabbar-bg:rgba(37,36,33,.94);
  --mig-card-bg:rgba(74,156,138,0.10);--mig-card-border:rgba(74,156,138,.28);--mig-card-hair:rgba(74,156,138,.15);--mig-t:#7fc0b0;
  --add-row-border:rgba(255,255,255,0.12);--add-row-bg:rgba(255,255,255,.03);
  --ringGuide:rgba(255,255,255,0.08);--ringTodayStroke:#1c1b19;
  --gridLine:rgba(255,255,255,0.06);--axisLine:rgba(255,255,255,0.12);--axisText:#8a8a85;--heatEmpty:rgba(255,255,255,0.06);
  --icon-btn-shadow:0 1px 2px rgba(0,0,0,.2);
  --card-shadow:0 1px 2px rgba(0,0,0,.25),0 4px 12px rgba(0,0,0,.3);
  --card-shadow-press:0 1px 2px rgba(0,0,0,.3);
}
/* ===== 启动画面 splash ===== */
#splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#ffffff 0%,#e8f2ef 100%);transition:opacity .45s ease,visibility .45s ease}
#splash.splash-hidden{opacity:0;visibility:hidden;pointer-events:none}
#splash .sp-logo{width:96px;height:96px;display:block;animation:sp-pop .5s ease}
#splash .sp-name{margin-top:18px;font-size:26px;font-weight:700;letter-spacing:.5px;color:var(--brand)}
#splash .sp-slogan{margin-top:6px;font-size:13px;color:var(--muted);letter-spacing:.2px}
#splash .sp-spin{margin-top:26px;width:26px;height:26px;border-radius:50%;border:3px solid rgba(45,122,107,.18);border-top-color:var(--brand);animation:sp-spin .8s linear infinite}
@keyframes sp-spin{to{transform:rotate(360deg)}}
@keyframes sp-pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg-outer);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);display:flex;justify-content:center;min-height:100vh;transition:background-color .25s ease}
#app{width:375px;min-height:100vh;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 0 30px rgba(0,0,0,.10);transition:background-color .25s ease}
.view{display:none}.view.on{display:block}
.brand{padding:12px 16px 0;text-align:center}
.brand-row{display:flex;align-items:center;justify-content:center;gap:8px}
.brand-name{font-size:20px;font-weight:700;letter-spacing:.5px}
.brand-icon{width:22px;height:22px;flex:none;display:block}
.slogan{text-align:center;color:var(--muted);font-size:12px;padding:6px 20px 8px;letter-spacing:.2px}
.head{display:flex;align-items:center;justify-content:space-between;padding:2px 16px 10px;position:relative}
.head-title{font-size:24px;font-weight:700}
.head-side{display:flex;align-items:center;gap:8px}
.icon-btn{width:36px;height:36px;border-radius:999px;border:1px solid var(--hair);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .12s ease;color:var(--ink);font-size:16px;box-shadow:var(--icon-btn-shadow)}
.icon-btn:active{transform:scale(.95)}.icon-btn svg{width:18px;height:18px;display:block}
.center-title{position:absolute;left:0;right:0;text-align:center;font-size:17px;font-weight:600;pointer-events:none}
.card{margin:10px 16px;background:var(--card);border-radius:14px;padding:14px;box-shadow:var(--card-shadow);display:flex;align-items:center;gap:10px;transition:transform .12s ease,box-shadow .12s ease}
.card:active{transform:scale(.99);box-shadow:var(--card-shadow-press)}
.card-main{flex:1;min-width:0}
.h-name{font-size:17px;font-weight:700;color:var(--ink)}
.h-sub{font-size:12px;color:var(--muted);margin-top:3px}
.mini{margin-top:8px}
.chev{flex:none;margin-left:-2px;margin-right:-2px;opacity:.85}
.check{width:44px;height:44px;border-radius:999px;border:1.5px solid var(--missStroke);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:border-color .3s ease,background-color .3s ease;flex:none}
.check.on{background:var(--brand);border-color:var(--brand)}
.check svg{width:22px;height:22px}
.check path{stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;fill:none;opacity:0;transition:opacity .3s ease}
.check.on path{opacity:1}
.check.breathe{animation:breathe 1.05s cubic-bezier(.38,0,.28,1)}
@keyframes breathe{
  0%{transform:scale(1);box-shadow:0 0 0 0 rgba(var(--brandRgb),.5)}
  50%{transform:scale(1.08);box-shadow:0 0 0 11px rgba(var(--brandRgb),0)}
  100%{transform:scale(1);box-shadow:0 0 0 0 rgba(var(--brandRgb),0)}
}
.card.hint{animation:cardHint 1.6s ease 2}
@keyframes cardHint{0%,100%{box-shadow:var(--card-shadow)}50%{box-shadow:0 0 0 5px rgba(var(--brandRgb),.16),var(--card-shadow)}}
.add-row{margin:10px 16px;height:56px;border-radius:14px;border:1.5px dashed var(--add-row-border);background:var(--add-row-bg);display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:15px;cursor:pointer;transition:transform .12s ease}
.add-row:active{transform:scale(.98)}
.add-row i{width:20px;height:20px;border-radius:999px;background:var(--brand);color:#fff;font-style:normal;font-size:15px;line-height:20px;text-align:center}
.detail{position:absolute;inset:0;background:var(--bg);z-index:20;overflow-y:auto;display:none}
.detail.on{display:block}
.hero-guide{margin:6px 16px 0;background:var(--brand-soft);color:var(--brand-soft-text);font-size:12px;padding:8px 10px;border-radius:10px;display:flex;align-items:center;justify-content:space-between}
.ring-wrap{display:flex;justify-content:center;padding:14px 0 6px;position:relative}
.ring-glow{position:absolute;border-radius:999px;width:230px;height:230px;border:2px solid var(--brand);opacity:0;pointer-events:none}
.ring-glow.play{animation:glow 1.5s ease}
@keyframes glow{0%{opacity:.35;transform:scale(.9)}100%{opacity:0;transform:scale(1.3)}}
.arc-new{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .7s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pop-in{animation:popIn .45s ease}
@keyframes popIn{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
.ring-breathe{animation:ringBreathe 1.05s ease}
@keyframes ringBreathe{
  0%{filter:drop-shadow(0 0 0 rgba(var(--brandRgb),0))}
  50%{filter:drop-shadow(0 0 7px rgba(var(--brandRgb),.5))}
  100%{filter:drop-shadow(0 0 0 rgba(var(--brandRgb),0))}
}
.stats{display:flex;margin:6px 16px 0;background:var(--card);border-radius:14px;padding:12px 0;box-shadow:var(--card-shadow)}
.stat{flex:1;text-align:center;border-right:1px solid var(--hair)}.stat:last-child{border-right:none}
.stat-num{font-size:22px;font-weight:700;color:var(--ink)}
.stat-lab{font-size:11px;color:var(--muted);margin-top:2px}
.big-btn{margin:14px 16px 0;height:50px;border-radius:999px;background:var(--brand);color:#fff;font-size:17px;font-weight:600;border:none;cursor:pointer;transition:transform .12s ease;width:calc(100% - 32px)}
.big-btn:active{transform:scale(.95)}
.big-btn.done{background:var(--card);color:var(--brand);border:1.5px solid var(--brand)}
.big-btn.rest{background:var(--rest);color:#fff}
.row{display:flex;align-items:center;justify-content:space-between;margin:10px 16px 0;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--card-shadow)}
.row-lab{font-size:15px}.row-sub{font-size:11px;color:var(--muted);margin-top:3px}
.tick{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--missStroke);background:var(--input-bg);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .25s ease;flex:none}
.tick svg{width:16px;height:16px}
.tick path{stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none;opacity:0;transition:opacity .25s ease}
.tick.on{background:var(--rest);border-color:var(--rest)}.tick.on path{opacity:1}
.block{margin:10px 16px 0;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--card-shadow)}
.block-title{font-size:13px;font-weight:600;margin-bottom:10px}
.makeup{display:flex;gap:6px}
.mk{flex:1;height:48px;border-radius:10px;border:1px solid var(--hair);background:var(--input-bg);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:transform .12s ease,background-color .2s ease}
.mk:active{transform:scale(.95)}
.mk i{width:9px;height:9px;border-radius:999px;background:var(--missStroke)}
.mk i.done{background:var(--brand)}.mk i.rest{background:var(--rest)}
.mk span{font-size:10px;color:var(--muted);margin-top:6px}
.ghost-btn{margin:12px 16px 24px;height:48px;border-radius:999px;background:var(--card);color:var(--brand);border:1.5px solid var(--brand);font-size:16px;font-weight:600;cursor:pointer;transition:transform .12s ease;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:var(--card-shadow)}
.ghost-btn:active{transform:scale(.95)}
.heat12{display:grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px}
.heat12 i{display:block;border-radius:3px;background:var(--heatEmpty)}
.heat12 i.on{background:var(--brand)}.heat12 i.rest{background:var(--rest)}
.heat-legend{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:10px;color:var(--muted)}
.heat-legend i{display:inline-block;width:10px;height:10px;border-radius:2px}
.usage-card{margin:12px 16px 0;background:var(--card);border-radius:14px;padding:12px 0 8px;box-shadow:var(--card-shadow)}
.usage-t{font-size:13px;font-weight:600;padding:0 14px 8px}
.usage-grid{display:flex}
.usage-grid>div{flex:1;text-align:center;border-right:1px solid var(--hair);padding:2px 0}
.usage-grid>div:last-child{border-right:none}
.usage-num{font-size:22px;font-weight:700;color:var(--ink)}
.usage-lab{font-size:11px;color:var(--muted);margin-top:3px}
.mig-card{margin:12px 16px 0;background:var(--mig-card-bg);border:1.5px solid var(--mig-card-border);border-radius:14px;padding:12px 14px}
.mig-t{font-size:13px;font-weight:700;color:var(--mig-t)}
.mig-rows{margin-top:8px}
.mig-swipe{position:relative;overflow:hidden;border-top:1px solid var(--mig-card-hair);touch-action:pan-y}
.mig-swipe:first-child{border-top:none}
.mig-actions{position:absolute;right:0;top:0;bottom:0;display:flex;align-items:stretch}
.mig-actions span{display:flex;align-items:center;justify-content:center;width:60px;font-size:12.5px;font-weight:600;color:#fff;cursor:pointer}
.mig-act-edit{background:#b8932c}.mig-act-del{background:#b23b34}
.mig-front{position:relative;background:var(--mig-card-bg);display:flex;align-items:center;gap:10px;padding:9px 0;transition:transform .22s ease;will-change:transform}
.mig-swipe.open .mig-front{transform:translateX(-120px)}
.mig-em{width:30px;height:30px;border-radius:999px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:15px;flex:none;border:1px solid var(--hair)}
.mig-main{flex:1;min-width:0}
.mig-n1{font-size:13.5px;font-weight:600}
.mig-n2{font-size:11px;color:var(--muted);margin-top:2px}
.mig-empty-row{margin-top:8px;height:44px;border:1.5px dashed var(--mig-card-border);border-radius:10px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--brand);font-size:13px;font-weight:600;cursor:pointer;background:var(--add-row-bg);transition:transform .12s ease}
.mig-empty-row:active{transform:scale(.98)}
.mig-empty-row i{width:18px;height:18px;border-radius:999px;background:var(--brand);color:#fff;font-style:normal;font-size:14px;line-height:18px;text-align:center}
.honors-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 16px 0}
.badge{background:var(--card);border-radius:14px;padding:14px 6px;text-align:center;border:1.5px solid transparent;box-shadow:var(--card-shadow)}
.badge.locked{opacity:.5;box-shadow:none;background:transparent;border-color:var(--hair)}
.badge .em{font-size:26px;line-height:1}
.badge .bn{font-size:12px;font-weight:600;margin-top:8px}
.badge .bc{font-size:10px;color:var(--muted);margin-top:4px}
.badge.got{border-color:var(--brand);background:var(--brand-soft)}
.honor-item{display:flex;align-items:center;gap:10px;margin:10px 16px 0;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--card-shadow);cursor:pointer;transition:transform .12s ease}
.honor-item:active{transform:scale(.99)}
.honor-item .em{font-size:22px}
.honor-item .tx{flex:1;min-width:0}
.honor-item .t1{font-size:15px;font-weight:600}
.honor-item .t2{font-size:11px;color:var(--muted);margin-top:3px}
.pro-card{margin:14px 16px 0;background:linear-gradient(135deg,var(--brand),var(--brand-deep));border-radius:14px;padding:14px 60px 14px 16px;color:#fff;cursor:pointer;position:relative;transition:transform .12s ease}
.pro-card:active{transform:scale(.99)}
.pro-card-t{font-size:15px;font-weight:700}
.pro-card-s{font-size:12px;opacity:.85;margin-top:4px}
.pro-card-a{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:600}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:56px;background:var(--tabbar-bg);backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);border-top:1px solid var(--hair);display:flex;z-index:15;transition:background-color .25s ease}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--muted);cursor:pointer;gap:3px}
.tab .ti{font-size:16px;line-height:1}
.tab.on{color:var(--brand)}
.pad-bottom{height:70px}
.sheet-mask{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:30;opacity:0;pointer-events:none;transition:opacity .25s ease}
.sheet-mask.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:20px 20px 0 0;z-index:31;transform:translateY(102%);transition:transform .3s cubic-bezier(.2,.8,.2,1),background-color .25s ease;padding:8px 16px 20px;max-height:88%;overflow-y:auto}
.sheet.on{transform:translateY(0)}
.sheet-bar{width:36px;height:4px;border-radius:999px;background:var(--hair);margin:6px auto 12px}
.sheet-title{font-size:19px;font-weight:700;margin-bottom:14px}
.field{margin-bottom:14px}
.field-lab{font-size:12px;color:var(--muted);margin-bottom:6px}
.rem-row{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:14px;box-shadow:var(--card-shadow)}
.rem-row .t1{font-size:15px;font-weight:500;color:var(--ink)}
.rem-row .t2{font-size:11px;color:var(--muted);margin-top:3px}
.switch{width:50px;height:30px;border-radius:999px;background:var(--missStroke);position:relative;cursor:pointer;transition:background-color .25s ease;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:999px;background:#fff;transition:transform .25s ease;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--brand)}
.switch.on::after{transform:translateX(20px)}
.input{width:100%;height:46px;border-radius:12px;border:1px solid var(--hair);background:var(--input-bg);padding:0 12px;font-size:15px;color:var(--ink);font-family:inherit;outline:none;box-shadow:var(--icon-btn-shadow)}
.textarea{height:66px;padding-top:12px;resize:none}
.seg{display:flex;gap:6px}
.seg button{flex:1;height:42px;border-radius:12px;border:1px solid var(--hair);background:var(--input-bg);font-size:13px;cursor:pointer;color:var(--ink);font-family:inherit;transition:background-color .15s ease}
.seg button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.sheet-actions{display:flex;gap:10px;margin-top:6px}
.btn{flex:1;height:48px;border-radius:999px;font-size:16px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:transform .12s ease}
.btn:active{transform:scale(.95)}
.btn-primary{background:var(--brand);color:#fff}
.btn-ghost{background:var(--card);color:var(--ink);border:1px solid var(--hair)}
.set-group-title{font-size:12px;font-weight:600;color:var(--muted);padding:14px 4px 8px;letter-spacing:.2px}
.set-group-title:first-child{padding-top:6px}
.set-list{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--card-shadow)}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border-top:1px solid var(--hair);cursor:pointer;transition:background-color .15s ease;gap:12px}
.set-row:first-child{border-top:none}
.set-row:active{background:rgba(0,0,0,.03)}
[data-theme="dark"] .set-row:active{background:rgba(255,255,255,.04)}
.set-row .t1{font-size:15px;font-weight:500;color:var(--ink)}
.set-row .t2{font-size:11px;color:var(--muted);margin-top:3px}
.set-row .val{font-size:14px;color:var(--muted);flex:none}
.set-row .arrow{color:var(--muted);font-size:14px;flex:none;opacity:.7}
.set-row .t1-wrap{flex:1;min-width:0}
.pay-close{position:absolute;top:14px;right:16px;width:32px;height:32px;border-radius:999px;border:0;background:var(--hair);font-size:14px;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2}
.pay-hero{text-align:center;padding:6px 0 18px}
.pay-icon{width:56px;height:56px;display:block;margin:0 auto 12px}
.pay-title{font-size:22px;font-weight:700;margin:0 0 4px}
.pay-sub{font-size:13px;color:var(--muted);margin:0}
.pay-benefits{list-style:none;padding:0;margin:0 0 18px;background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--card-shadow)}
.pay-benefits li{position:relative;padding:12px 16px 12px 40px;border-top:1px solid var(--hair)}
.pay-benefits li:first-child{border-top:none}
.pay-benefits li b{display:block;font-size:15px;font-weight:600}
.pay-benefits li span{font-size:12px;color:var(--muted);margin-top:2px;display:block}
.pay-benefits li::before{content:"✓";position:absolute;left:14px;top:14px;color:var(--brand);font-weight:700;font-size:14px}
.pay-actions{display:flex;flex-direction:column;gap:10px}
.pay-foot{display:flex;justify-content:center;gap:6px;margin-top:14px;font-size:12px;color:var(--muted)}
.pay-foot span{cursor:pointer}
.pay-fine{font-size:11px;color:var(--muted);text-align:center;margin:8px 0 0;line-height:1.5}
.pay-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px 0;gap:12px}
.pay-spinner{width:28px;height:28px;border:3px solid var(--hair);border-top-color:var(--brand);border-radius:999px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pay-loading-text{font-size:13px;color:var(--muted)}
.pay-fail{background:var(--brand-soft);border:1.5px solid var(--brand-soft-text);border-radius:14px;padding:16px;text-align:center;margin-bottom:18px}
.pay-fail-t{font-size:15px;font-weight:700;color:var(--brand-soft-text);margin:0 0 6px}
.pay-fail-s{font-size:12.5px;color:var(--muted);margin:0 0 12px;line-height:1.5}
.pay-retry{display:inline-block;padding:8px 20px;background:var(--brand);color:#fff;border-radius:999px;font-size:14px;font-weight:600;border:0;cursor:pointer;font-family:inherit}
.doc-sheet{max-height:88%}
.doc-title{font-size:22px;font-weight:700;margin:0 0 6px}
.doc-updated{font-size:11px;color:var(--muted);margin:0 0 18px}
.doc-h{font-size:15px;font-weight:700;margin:20px 0 8px}
.doc-p{font-size:14px;line-height:1.65;color:var(--ink);margin:0 0 10px}
details.faq{background:var(--card);border-radius:12px;margin-bottom:8px;padding:0;overflow:hidden;box-shadow:var(--card-shadow)}
details.faq summary{list-style:none;cursor:pointer;padding:14px 16px;font-size:14px;font-weight:600;position:relative}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary::after{content:"＋";position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px;transition:transform .2s ease}
details.faq[open] summary::after{content:"−"}
details.faq .faq-body{padding:0 16px 14px;font-size:13.5px;line-height:1.6;color:var(--muted)}
.perm-hero{text-align:center;padding:6px 0 20px}
.perm-icon{width:64px;height:64px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;background:var(--brand-soft);border-radius:999px;font-size:30px;line-height:1}
.perm-title{font-size:22px;font-weight:700;margin:0 0 8px}
.perm-sub{font-size:13px;color:var(--muted);margin:0;line-height:1.55;max-width:290px;margin-left:auto;margin-right:auto}
.perm-points{list-style:none;padding:0;margin:0 0 18px;background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--card-shadow)}
.perm-points li{position:relative;padding:13px 16px 13px 40px;border-top:1px solid var(--hair);font-size:14px;line-height:1.45;color:var(--ink)}
.perm-points li:first-child{border-top:none}
.perm-points li::before{content:"✓";position:absolute;left:14px;top:14px;color:var(--brand);font-weight:700;font-size:14px}
.poster-box{text-align:center;padding:6px 0 4px}
.poster-box img{width:300px;height:auto;border-radius:16px;box-shadow:0 8px 26px rgba(0,0,0,.16)}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;font-size:13px;padding:9px 14px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:60;white-space:nowrap;max-width:88%;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1}
.float-msg{position:absolute;top:120px;left:50%;transform:translateX(-50%);font-size:13px;color:var(--brand);opacity:0;pointer-events:none;transition:opacity .3s ease;z-index:40;white-space:nowrap}
.float-msg.on{opacity:1}
button:focus-visible,.tab:focus-visible,.add-row:focus-visible,.card:focus-visible,.mk:focus-visible,.icon-btn:focus-visible,.tick:focus-visible,.mig-empty-row:focus-visible,.set-row:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
</style>

<script>
  (function(){
    function hideSplash(){
      var s = document.getElementById('splash');
      if (!s) return;
      s.classList.add('splash-hidden');
      setTimeout(function(){ if (s && s.parentNode) s.parentNode.removeChild(s); }, 500);
    }
    if (document.readyState === 'complete') setTimeout(hideSplash, 600);
    else window.addEventListener('load', function(){ setTimeout(hideSplash, 600); });
    setTimeout(hideSplash, 3000); // 兜底：最多 3 秒强制隐藏，避免卡死
  })();
</script>

   1. IAP 原生模块用动态 import，失败返 null 不崩溃
   2. getOfferings() 必须有 8 秒超时，超时进 failed 态
   3. 失败时绝不显示"加载中"，要有可见原因 + 重试按钮

  var cs = getComputedStyle(document.documentElement), g = function(k){ return cs.getPropertyValue(k).trim(); };
  C.brand=g('--brand'); C.brandRgb=g('--brandRgb'); C.rest=g('--rest');

  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#2d7a6b"/><path d="M6.5 12.2 L10.2 16 L17.5 8.2" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>'
);
var NOTIF_BADGE = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#2d7a6b"/></svg>'
);
function notifSupported(){ return typeof Notification !== "undefined" && "requestPermission" in Notification; }
function notifPermission(){
  if (!notifSupported()) return "unsupported";
  try { return Notification.permission; } catch(e) { return "unsupported"; }
}
function requestNotifPermission(){
  return new Promise(function(resolve){
    if (!notifSupported()){ resolve("unsupported"); return; }
    try {
      var p = Notification.requestPermission(function(res){ resolve(res); });
      if (p && typeof p.then === "function") p.then(resolve);
    } catch(e){ resolve("default"); }
  });
}
function fireNotification(title, body, tag){
  if (notifPermission() !== "granted") return false;
  try {
    var n = new Notification(title, {
      body: body, tag: tag || "seeora",
      icon: NOTIF_ICON, badge: NOTIF_BADGE,
      renotify: true, silent: false
    });
    n.onclick = function(){ try{ window.focus(); }catch(e){} n.close(); };
    return true;
  } catch(e){ console.warn("[notify] failed:", e); return false; }
}

/* 提醒调度占位（真正上线时由 Capacitor / RN / 原生接管） */
function scheduleReminder(habit){
  if (!habit || !habit.reminder || !habit.reminder.on) return;
  console.log("[schedule] (stub) daily at", habit.reminder.time, "for", habit.id);
}

/* 前台定时检查 */
function checkReminders(){
  if (notifPermission() !== "granted") return;
  var now = new Date();
  var hh = String(now.getHours()).padStart(2, "0");
  var mm = String(now.getMinutes()).padStart(2, "0");
  var timeNow = hh + ":" + mm;
  var todayKey = now.getFullYear() + "-" + (now.getMonth() + 1) + "-" + now.getDate();
  HABITS.forEach(function(h){
    if (!h.reminder || !h.reminder.on) return;
    if (h.reminder.time !== timeNow) return;
    if (h.week[6] === 1) return;
    var firedKey = "seeora_fired_" + h.id + "_" + todayKey;
    try {
      if (localStorage.getItem(firedKey)) return;
      localStorage.setItem(firedKey, "1");
    } catch(e){}
    fireNotification(tr(h), isZh() ? "今天还没打卡哦,现在去做吧" : "Not checked in yet today — go do it.", "seeora-" + h.id);
  });
}
setInterval(checkReminders, 30000);
document.addEventListener("visibilitychange", function(){ if (!document.hidden) checkReminders(); });

  document.documentElement.setAttribute("data-theme", th);
}
function setTheme(v){
  THEME = v; try{ localStorage.setItem("seeora_theme", v); }catch(e){}
  applyTheme(); refreshColors();
  renderList();

    var c = document.getElementById(id); if (c) c.textContent = (k === THEME) ? "✓" : "";
  });
}
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function(){
  if (THEME === "system"){ applyTheme(); refreshColors(); renderList();

    var arr = JSON.parse(raw);
    if (Array.isArray(arr) && arr.length){
      arr.forEach(function(h){
        if (h.curve && typeof h.curve[0] === "number") h.curve = h.curve.map(function(v){ return { v:v, ok:1 }; });

    try{ localStorage.removeItem("seeora_pro_trial_until"); }catch(e){}
    saveReceipt({ type:"lifetime", at: Date.now() });
  }
  // 注意：setPro(false) 不清空凭证，保留供「恢复购买」找回（与真机重装后本地标记丢失、服务端凭证仍在一致）
  try{ localStorage.setItem("seeora_pro", PRO?"1":"0"); }catch(e){}
  renderAll();
}
function startTrial(days){
  if (PRO) return; // 已买断不降级
  PRO = false;
  PRO_TRIAL_UNTIL = Date.now() + (days||7)*86400000;
  try{
    localStorage.setItem("seeora_pro","0");
    localStorage.setItem("seeora_pro_trial_until", String(PRO_TRIAL_UNTIL));
  }catch(e){}
  renderAll();
}
function saveReceipt(rec){
  PRO_RECEIPT = rec;
  try { if (rec) localStorage.setItem("seeora_receipt", JSON.stringify(rec)); else localStorage.removeItem("seeora_receipt"); }catch(e){}
}
// 模拟从商店恢复已购：读取服务端购买凭证，返回 lifetime 凭证或 null
function restorePurchases(){
  return new Promise(function(resolve, reject){
    setTimeout(function(){
      if (getIapSimMode() === "fail"){ reject(new Error("restore_failed")); return; }
      try { var raw = localStorage.getItem("seeora_receipt"); PRO_RECEIPT = raw ? JSON.parse(raw) : null; }catch(e){ PRO_RECEIPT = null; }
      resolve(PRO_RECEIPT && PRO_RECEIPT.type === "lifetime" ? PRO_RECEIPT : null);
    }, 1500);
  });
}

/* ===== 圆环 ===== */
var RING_R = 104, RING_N = 7, animatedArcs = {};
function renderRing(h){
  var S = 280, Cc = S/2, pts = [];
  for (var p=0;p<RING_N;p++){
    var a = (-90 + p*(360/RING_N))*Math.PI/180;
    pts.push({ x:Cc+RING_R*Math.cos(a), y:Cc+RING_R*Math.sin(a), p:p, st:h.week[p], today:p===RING_N-1 });
  }
  var s = '<svg width="280" height="280" viewBox="0 0 280 280">';
  s += '<circle cx="'+Cc+'" cy="'+Cc+'" r="'+RING_R+'" fill="none" stroke="'+C.ringGuide+'" stroke-width="1.5"/>';
  for (var k=0;k<RING_N;k++){
    var a1=pts[k], b1=pts[(k+1)%RING_N];
    if (a1.st!==1 || b1.st!==1) continue;
    var key = "a"+k, len = (2*Math.PI*RING_R)/RING_N*1.06;
    var anim = !animatedArcs[key];
    var dash = anim?' style="--len:'+len.toFixed(1)+';stroke-dasharray:'+len.toFixed(1)+';stroke-dashoffset:'+len.toFixed(1)+'"':'';
    s += '<path d="M'+a1.x.toFixed(1)+' '+a1.y.toFixed(1)+' A'+RING_R+' '+RING_R+' 0 0 1 '+b1.x.toFixed(1)+' '+b1.y.toFixed(1)+'" fill="none" stroke="'+C.brand+'" stroke-width="3" stroke-linecap="round"'+(anim?' class="arc-new"':'')+dash+'/>';
    if (anim) animatedArcs[key] = 1;
  }
  pts.forEach(function(q){
    var fill = q.st===1?C.brand:q.st===2?C.rest:C.missFill;
    var stroke = q.st===0?' stroke="'+C.missStroke+'" stroke-width="1.5"':'';
    s += '<circle cx="'+q.x.toFixed(1)+'" cy="'+q.y.toFixed(1)+'" r="13" fill="'+fill+'"'+stroke+
         (q.today?' stroke="'+C.ringTodayStroke+'" stroke-width="3"':'')+
         (q.today&&q.st===1?' class="pop-in"':'')+'/>';
  });
  return s+"</svg>";
}

/* ===== 曲线 ===== */
function renderCurve(h){
  var W=320, H=150, pad={l:30,r:14,t:14,b:26};
  var d = h.curve, n = d.length; if (!n) return "";
  var maxV = Math.max.apply(null, d.map(function(x){ return x.v; })) || 1;
  var X = function(i){ return pad.l + i*(W-pad.l-pad.r)/(n-1); };
  var Y = function(v){ return H-pad.b - (v/maxV)*(H-pad.t-pad.b); };
  var segs=[], cur={type:d[0].ok?"solid":"gap",pts:[{x:X(0),y:Y(d[0].v)}]};
  for (var i=1;i<n;i++){
    var type = d[i].ok?"solid":"gap";
    if (type!==cur.type){ cur.pts.push({x:X(i),y:Y(d[i].v)}); segs.push(cur); cur={type:type,pts:[{x:X(i),y:Y(d[i].v)}]}; }
    else cur.pts.push({x:X(i),y:Y(d[i].v)});
  }
  segs.push(cur);
  function smooth(pts){
    if (pts.length===1) return "M"+pts[0].x+" "+pts[0].y;
    var dd = "M"+pts[0].x.toFixed(1)+" "+pts[0].y.toFixed(1);
    for (var k=1;k<pts.length-1;k++){
      var mx=(pts[k].x+pts[k+1].x)/2, my=(pts[k].y+pts[k+1].y)/2;
      dd += " Q"+pts[k].x.toFixed(1)+" "+pts[k].y.toFixed(1)+" "+mx.toFixed(1)+" "+my.toFixed(1);
    }
    var last = pts[pts.length-1];
    return dd+" L"+last.x.toFixed(1)+" "+last.y.toFixed(1);
  }
  var s = '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">';
  [0,0.5,1].forEach(function(r){
    var yv = maxV*r, y = Y(yv);
    s += '<line x1="'+pad.l+'" y1="'+y.toFixed(1)+'" x2="'+(W-pad.r)+'" y2="'+y.toFixed(1)+'" stroke="'+C.gridLine+'" stroke-width="1" stroke-dasharray="'+(r===0?"0":"3 4")+'"/>';
    s += '<text x="'+(pad.l-6)+'" y="'+(y+3.5).toFixed(1)+'" font-size="9" fill="'+C.axisText+'" text-anchor="end">'+Math.round(yv)+'</text>';
  });
  s += '<line x1="'+pad.l+'" y1="'+pad.t+'" x2="'+pad.l+'" y2="'+(H-pad.b)+'" stroke="'+C.axisLine+'" stroke-width="1"/>';
  segs.forEach(function(g){
    if (g.pts.length<2) return;
    if (g.type==="solid") s += '<path d="'+smooth(g.pts)+'" fill="none" stroke="'+C.brand+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
    else s += '<path d="'+smooth(g.pts)+'" fill="none" stroke="'+C.brand+'" stroke-width="2" stroke-linecap="round" stroke-dasharray="0.1 5" opacity="0.45"/>';
  });
  d.forEach(function(x,i){
    s += '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(x.v).toFixed(1)+'" r="'+(x.ok?2.6:2)+'" fill="'+(x.ok?C.brand:"rgba("+C.brandRgb+",0.35)")+'"/>';
  });
  s += '<line x1="'+pad.l+'" y1="'+(H-pad.b)+'" x2="'+(W-pad.r)+'" y2="'+(H-pad.b)+'" stroke="'+C.axisLine+'" stroke-width="1"/>';
  [0,6,13,20].forEach(function(i){
    s += '<text x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" font-size="9.5" fill="'+C.axisText+'" text-anchor="'+(i===0?"start":i===20?"end":"middle")+'">'+(isZh()?"第"+(i+1)+"天":"Day "+(i+1))+'</text>';
  });
  return s+"</svg>";
}

/* ===== 热力图 ===== */
function heatData(h){
  var arr = [], rnd = function(i){ return ((i*9301+49297)%233280)/233280; };
  for (var w=0;w<12;w++) for (var d=0;d<7;d++){
    var i = w*7+d;
    if (w===11) arr.push(h.week[d]);
    else { var r = rnd(i+h.id.length*13); arr.push(r<0.14?2:r<0.26?0:1); }
  }
  return arr;
}
function renderHeat(h){
  var data = heatData(h), html = "";
  data.forEach(function(st){ html += '<i class="'+(st===1?"on":st===2?"rest":"")+'"></i>'; });
  return html;
}

function getIapSimMode(){
  try { return localStorage.getItem("seeora_iap_sim") || "ok"; } catch(e){ return "ok"; }
}

function fetchOfferings(){
  var mode = getIapSimMode();
  return new Promise(function(resolve, reject){
    var timer = setTimeout(function(){ reject(new Error("timeout")); }, DEFAULT_PRICE_TIMEOUT_MS);
    if (mode === "fail"){
      // 挂起，让 8 秒超时触发
      return;
    }
    setTimeout(function(){
      clearTimeout(timer);
      resolve({ monthly:{price:"$1.99"}, yearly:{price:"$9.99"}, lifetime:{price:"$4.99"} });
    }, 800);
  });
}

function setPaywallState(state, reason){
  payState = state;
  payReason = reason || null;
  var loading = document.getElementById("payLoading");
  var fail = document.getElementById("payFail");
  var benefits = document.querySelector(".pay-benefits");
  var actions = document.querySelector(".pay-actions");
  var foot = document.querySelector(".pay-foot");
  var fine = document.getElementById("payFine");

  loading.style.display = state === "loading" ? "flex" : "none";
  fail.style.display = state === "failed" ? "block" : "none";

  var hideBody = (state === "loading" || state === "failed");
  benefits.style.display = hideBody ? "none" : "block";
  actions.style.display = hideBody ? "none" : "flex";
  foot.style.display = hideBody ? "none" : "flex";
  fine.style.display = hideBody ? "none" : "block";

  if (state === "loading"){
    document.getElementById("payLoadingText").textContent = t().payLoadingPrices;
  }
  if (state === "failed"){
    document.getElementById("payFailTitle").textContent = t().payFailTitle;
    document.getElementById("payFailSub").textContent =
      reason === "timeout" ? t().payFailTimeout : t().payFailGeneric;
    document.getElementById("payRetry").textContent = t().payRetry;
  }
}

async function showPaywall(reason){
  lastPaywallReason = reason || "honors";
  var c = PAY_COPY[reason] || PAY_COPY.honors;
  document.getElementById("payTitle").textContent = t()[c[0]];
  document.getElementById("paySub").textContent = t()[c[1]];
  showSheet("sheetPay","maskPay");
  setPaywallState("loading");
  try {
    await fetchOfferings();
    setPaywallState("ready");
  } catch(err){
    setPaywallState("failed", err && err.message === "timeout" ? "timeout" : "error");
  }
}

function roundRectPath(g,x,y,w,h,r){
  if (g.roundRect){ g.beginPath(); g.roundRect(x,y,w,h,r); return; }
  g.beginPath(); g.moveTo(x+r,y); g.lineTo(x+w-r,y); g.quadraticCurveTo(x+w,y,x+w,y+r);
  g.lineTo(x+w,y+h-r); g.quadraticCurveTo(x+w,y+h,x+w-r,y+h); g.lineTo(x+r,y+h);
  g.quadraticCurveTo(x,y+h,x,y+h-r); g.lineTo(x,y+r); g.quadraticCurveTo(x,y,x+r,y); g.closePath();
}
function drawBrandIcon(g,cx,cy,r){
  g.save();
  var br = r*0.34;                 // 圆形半径
  var gap = r*0.9;                 // 圆心间距
  var cxs = [cx-gap, cx, cx+gap];
  var col = "#287868";             // 品牌绿（三步进度标识）
  g.strokeStyle = col; g.lineWidth = r*0.07; g.lineCap = "round";
  // 连接线（圆1-圆2、圆2-圆3）
  for (var i=0;i<2;i++){ g.beginPath(); g.moveTo(cxs[i]+br, cy); g.lineTo(cxs[i+1]-br, cy); g.stroke(); }
  // 圆3：绿色描边 + 中心小圆点
  g.beginPath(); g.arc(cxs[2], cy, br, 0, Math.PI*2); g.stroke();
  g.fillStyle = col; g.beginPath(); g.arc(cxs[2], cy, br*0.28, 0, Math.PI*2); g.fill();
  // 圆1、圆2：绿色填充 + 白色对勾
  for (var i=0;i<2;i++){
    var cx0 = cxs[i];
    g.fillStyle = col; g.beginPath(); g.arc(cx0, cy, br, 0, Math.PI*2); g.fill();
    g.strokeStyle = "#ffffff"; g.lineWidth = br*0.24; g.lineJoin = "round";
    g.beginPath();
    g.moveTo(cx0-br*0.42, cy+0.02*br);
    g.lineTo(cx0-br*0.10, cy+0.34*br);
    g.lineTo(cx0+br*0.48, cy-0.30*br);
    g.stroke();
  }
  g.restore();
}
function drawPoster(h){
  var isDark = document.documentElement.getAttribute("data-theme") === "dark";
  var W=750, H=1334, cv = document.createElement("canvas"); cv.width=W; cv.height=H;
  var g = cv.getContext("2d");
  var bgC = isDark?"#1c1b19":"#f1ede6", cardC = isDark?"#292725":"#ffffff", inkC = isDark?"#ebe8e2":"#2a2a2a";
  g.fillStyle = bgC; g.fillRect(0,0,W,H);
  var rg = g.createRadialGradient(W/2,260,40,W/2,260,620);
  rg.addColorStop(0,"rgba("+C.brandRgb+",0.12)"); rg.addColorStop(1,"rgba("+C.brandRgb+",0)");
  g.fillStyle = rg; g.fillRect(0,0,W,H);
  var top=h.streak, maxv=h.best, tot=h.total;
  g.textAlign = "center"; g.fillStyle = inkC;
  g.font = "700 80px -apple-system,PingFang SC,sans-serif"; g.fillText(tr(h), W/2, 220);
  g.save(); g.shadowColor = "rgba(0,0,0,0.14)"; g.shadowBlur = 40; g.shadowOffsetY = 14;
  g.fillStyle = cardC; roundRectPath(g,70,320,W-140,640,44); g.fill(); g.restore();
  var nums = [{v:top,l:t().currentStreak},{v:maxv,l:t().longest},{v:tot,l:t().total}];
  nums.forEach(function(n,i){
    var cx = 70 + (W-140)*(i+0.5)/3;
    g.fillStyle = C.brand; g.font = "700 96px -apple-system,PingFang SC,sans-serif"; g.fillText(String(n.v), cx, 620);
    g.fillStyle = "#8a8a85"; g.font = "500 28px -apple-system,PingFang SC,sans-serif"; g.fillText(n.l, cx, 680);
    if (i<2){ g.fillStyle = isDark?"rgba(255,255,255,0.08)":"rgba(0,0,0,0.08)"; g.fillRect(cx+(W-140)/6-1, 570, 2, 110); }
  });
  g.fillStyle = inkC; g.font = "600 34px -apple-system,PingFang SC,sans-serif";
  g.fillText(tr(h.desc)||"—", W/2, 800);
  g.fillStyle = C.brand; g.font = "700 44px -apple-system,PingFang SC,sans-serif";
  g.fillText(isZh()?"第 "+top+" 天":"Day "+top, W/2, 880);
  var brandText = t().brand;
  g.font = "700 46px -apple-system,PingFang SC,sans-serif";
  var btw = g.measureText(brandText).width, iconR=22, gap=16;
  var totalW = iconR*2+gap+btw, startX = W/2-totalW/2, iconCx = startX+iconR, brandCy = 1085;
  drawBrandIcon(g, iconCx, brandCy, iconR);
  g.fillStyle = inkC; g.textAlign = "left"; g.fillText(brandText, iconCx+iconR+gap, brandCy+16);
  g.textAlign = "center"; g.fillStyle = "#8a8a85"; g.font = "500 28px -apple-system,PingFang SC,sans-serif";
  g.fillText(t().slogan, W/2, 1160);
  if (!isPro()){
    g.globalAlpha = 0.4; g.fillStyle = "#8a8a85";
    g.font = "500 22px -apple-system,PingFang SC,sans-serif"; g.fillText("Made with Seeora", W/2, H-44);
    g.globalAlpha = 1;
  }
  return cv;
}
function dataURLtoBlob(url){
  var arr = url.split(","), mime = arr[0].match(/:(.*?);/)[1], bstr = atob(arr[1]);
  var u8 = new Uint8Array(bstr.length);
  for (var i=0;i<bstr.length;i++) u8[i] = bstr.charCodeAt(i);
  return new Blob([u8], { type:mime });
}

function exportData(){
  if (!isPro()){ showPaywall("export"); return; }
  var payload = { app:"Seeora", version:1, exportedAt:new Date().toISOString(),
    habits:HABITS, mig:MIG, settings:{ lang:LANG, theme:THEME } };
  var blob = new Blob([JSON.stringify(payload,null,2)], { type:"application/json" });
  var url = URL.createObjectURL(blob); var a = document.createElement("a");
  var d = new Date();
  var stamp = d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
  a.href = url; a.download = "seeora-backup-"+stamp+".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 500);
  toast(t().exported);
}
function importData(){
  var inp = document.getElementById("fileImport"); inp.value = ""; inp.click();
}
document.getElementById("fileImport").addEventListener("change", function(e){
  var f = e.target.files && e.target.files[0]; if (!f) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var obj = JSON.parse(reader.result);
      if (!obj || !Array.isArray(obj.habits)) throw new Error("bad");
      if (!window.confirm(t().importConfirm)) return;
      HABITS = obj.habits.map(function(h){
        if (h.curve && typeof h.curve[0] === "number") h.curve = h.curve.map(function(v){ return { v:v, ok:1 }; });
        return h;
      });
      MIG = Array.isArray(obj.mig) ? obj.mig : [];
      if (obj.settings){
        if (obj.settings.lang){ LANG = obj.settings.lang; saveLang(); }
        if (obj.settings.theme){ THEME = obj.settings.theme; try{ localStorage.setItem("seeora_theme", THEME); }catch(_){} }
      }
      saveHabits(); saveMig(); applyTheme(); refreshColors();
      renderAll(); updateThemeUI(); updateLangUI();
      toast(t().imported);
    }catch(err){ toast(t().importFail); }
  };
  reader.readAsText(f);
});

document.getElementById("list").addEventListener("click", function(e){
  var btn = e.target.closest ? e.target.closest(".check") : null; if (!btn) return;
  e.stopPropagation();
  var i = +btn.getAttribute("data-i"), h = HABITS[i];
  var nowDone = h.week[6]!==1; h.week[6] = nowDone?1:0;
  if (nowDone){
    h.streak += 1; if (h.streak > h.best) h.best = h.streak;
    btn.classList.add("on","breathe"); setTimeout(function(){ btn.classList.remove("breathe"); }, 1120);
  } else { h.streak = Math.max(0, h.streak-1); btn.classList.remove("on"); }
  var card = btn.parentElement;
  card.querySelector(".h-sub").textContent = t().habitSub(h.streak, h.freqDays);
  card.querySelector(".mini").innerHTML = miniDots(h.week);
  saveHabits(); renderDetail(); renderUsage(); renderHonors();
});

document.getElementById("btnCheck").addEventListener("click", function(){
  var h = HABITS[curIdx], prev = h.week[6];
  if (prev === 2){
    h.week[6] = 1; h.streak += 1;
    if (h.streak > h.best){
      h.best = h.streak;
      var gl = document.getElementById("ringGlow");
      gl.classList.remove("play"); void gl.offsetWidth; gl.classList.add("play");
      floatMsg(t().newBest + h.best + " " + t().days);
    }
    toast(t().checkIn);
  } else if (prev === 1){ h.week[6] = 0; h.streak = Math.max(0, h.streak-1); }
  else {
    h.week[6] = 1; h.streak += 1;
    if (h.streak > h.best){
      h.best = h.streak;
      var gl2 = document.getElementById("ringGlow");
      gl2.classList.remove("play"); void gl2.offsetWidth; gl2.classList.add("play");
      floatMsg(t().newBest + h.best + " " + t().days);
    }
    var full = h.week.every(function(x){ return x===1; });
    if (full){
      var svg = document.querySelector("#ring svg");
      if (svg){ svg.classList.remove("ring-breathe"); void svg.offsetWidth; svg.classList.add("ring-breathe"); }
    }
  }
  animatedArcs = {}; saveHabits();
  renderDetail(); renderList(); renderUsage(); renderHonors();
});

    document.getElementById("segGoal").children[i].textContent = String(v);
  });
  document.getElementById("inpName").value = "";
  document.getElementById("inpDesc").value = "";
  document.getElementById("swAddRem").classList.remove("on");
  document.getElementById("addTimeWrap").style.display = "none";
  document.getElementById("inpAddTime").value = "20:00";
  showSheet("sheetAdd","maskAdd");
});
document.getElementById("btnAddClose").addEventListener("click", function(){ hideSheet("sheetAdd","maskAdd"); });
document.getElementById("btnAddCancel").addEventListener("click", function(){ hideSheet("sheetAdd","maskAdd"); });
document.getElementById("maskAdd").addEventListener("click", function(){ hideSheet("sheetAdd","maskAdd"); });
document.getElementById("segFreq").addEventListener("click", function(e){
  var b = e.target.closest ? e.target.closest("button") : null; if (!b) return;
  Array.prototype.forEach.call(this.children, function(x){ x.classList.remove("on"); });
  b.classList.add("on"); addFreq = +b.getAttribute("data-v");
});
document.getElementById("segGoal").addEventListener("click", function(e){
  var b = e.target.closest ? e.target.closest("button") : null; if (!b) return;
  Array.prototype.forEach.call(this.children, function(x){ x.classList.remove("on"); });
  b.classList.add("on"); addGoal = +b.getAttribute("data-v");
});
document.getElementById("btnAddSave").addEventListener("click", function(){
  var name = document.getElementById("inpName").value.trim();
  if (!name){ toast(isZh()?"请先填写习惯名称":"Please enter a name"); return; }
  if (!isPro() && HABITS.length >= 5){ hideSheet("sheetAdd","maskAdd"); showPaywall("limit"); return; }

  var remOn = document.getElementById("swAddRem").classList.contains("on");
  var remTime = document.getElementById("inpAddTime").value || "20:00";

  var newHabit = {
    id:"h"+Date.now(), zh:name, en:name,
    desc:{ zh:document.getElementById("inpDesc").value.trim()||name,
           en:document.getElementById("inpDesc").value.trim()||name },
    freqDays:addFreq, goal:addGoal, streak:0, best:0, total:0,
    week:[0,0,0,0,0,0,0],
    curve:(function(){ var a=[]; for (var i=0;i<21;i++) a.push({v:0,ok:0}); return a; })(),
    reminder: { on: remOn, time: remTime }
  };
  HABITS.push(newHabit);
  if (remOn) scheduleReminder(newHabit);

  saveHabits(); hideSheet("sheetAdd","maskAdd");
  renderList(); renderUsage(); renderHonors();
});

/* ===== Tab ===== */
var TAB_VIEW = { tabHabits:"home", tabHonors:"honors" };
function tab(id){
  var view = TAB_VIEW[id];
  ["home","honors"].forEach(function(v){ document.getElementById("view-"+v).classList.toggle("on", v===view); });
  ["tabHabits","tabHonors"].forEach(function(x){ document.getElementById(x).classList.toggle("on", x===id); });
  if (view==="honors") renderHonors();
}
document.getElementById("tabHabits").addEventListener("click", function(){ tab("tabHabits"); });
document.getElementById("tabHonors").addEventListener("click", function(){ tab("tabHonors"); });

/* ===== 启动 ===== */
applyTheme(); refreshColors();
var guideSeen = false;
try{ guideSeen = !!localStorage.getItem("seeora_guide"); }catch(e){}
if (!guideSeen){
  var gb = document.getElementById("guideBox"); gb.style.display = "flex";
  gb.addEventListener("click", function(){
    try{ localStorage.setItem("seeora_guide","1"); }catch(e){}
    gb.style.display = "none";
  });
}
renderAll();
</script>
